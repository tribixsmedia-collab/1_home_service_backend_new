# nginx site for the Home Service backend on an EC2 box.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/homeservice
#   sudo ln -sf /etc/nginx/sites-available/homeservice /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.example.com below with the real domain first. Then run certbot
# (see deploy/README.md); it rewrites this file to add the certificate and the
# http -> https redirect, so do not hand-write those.

upstream homeservice_app {
    server unix:/run/homeservice.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Uploads: tender drawings, vendor ID scans, curation videos. Django's own
    # limits are smaller and more specific; this only stops nginx rejecting a
    # large file with a 413 before Django ever sees it.
    client_max_body_size 100M;

    # Long enough for a slow phone on 3G to finish an upload, short enough that
    # a wedged worker is not held forever.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    access_log /var/log/nginx/homeservice.access.log;
    error_log  /var/log/nginx/homeservice.error.log;

    # ---- Vendor ID documents: never public. ----
    #
    # These are government ID, address and trade proofs. They live on this
    # disk rather than Cloudinary precisely so access can be checked first
    # (config/storages.py, private_storage). The check is in Django, so the
    # raw path must be unreachable from outside. Longest-prefix wins in nginx,
    # so this beats the /media/ block below.
    location /media/vendor_documents/ {
        return 404;
    }

    # The internal twin of the block above. Unreachable from the network --
    # only Django can trigger it, by returning an X-Accel-Redirect header from
    # dashboard.views.vendor_document_view once it has checked the admin's
    # permission. nginx then streams the file and Python is free immediately.
    #
    # Requires MEDIA_X_ACCEL_REDIRECT=True in .env. With it off, Django serves
    # the bytes itself and this block is simply never used.
    location /protected-media/ {
        internal;
        alias /srv/homeservice/media/;
    }

    # Everything else under media/ is public by design: category icons, banners
    # and tender attachments, which fall back here whenever Cloudinary is not
    # configured. With Cloudinary on, these URLs are barely touched.
    location /media/ {
        alias /srv/homeservice/media/;
        expires 7d;
        add_header Cache-Control "public";

        # The web app is served from a DIFFERENT hostname, so every image here
        # is a cross-origin load. Flutter web's CanvasKit renderer draws images
        # into a WebGL canvas and therefore requests them with crossOrigin set,
        # which fails outright without this header -- the file downloads fine
        # in a browser tab and still renders as a blank placeholder in the app.
        #
        # Django's CORS middleware cannot help: nginx serves these files
        # directly and Python never sees the request.
        #
        # "*" is correct here rather than a named origin: this block is public
        # media only -- category icons, banners, tender attachments. Vendor ID
        # documents are 404'd above and served through /protected-media/.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Static files are handled by WhiteNoise inside the app (it is in
    # MIDDLEWARE), so they are deliberately not served here. Keeping one owner
    # avoids the classic "nginx serves a stale copy collectstatic replaced".

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # settings.py sets SECURE_PROXY_SSL_HEADER to this. Without it Django
        # thinks every request is plain http, and SECURE_SSL_REDIRECT then
        # bounces https requests back to https for ever.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_pass http://homeservice_app;
    }
}
