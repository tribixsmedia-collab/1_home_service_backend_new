# nginx site for the customer web app (Flutter web build).
#
# Separate hostname from the API on purpose. Django owns "/" on the API host --
# the admin dashboard is served there -- so the web app cannot sit at the root
# of the same name without hiding it. Two names also match the shape this ends
# up in on a real domain: api.example.com and www.example.com.
#
# Install:
#   sudo cp deploy/nginx-web.conf /etc/nginx/sites-available/homeservice-web
#   sudo ln -sf /etc/nginx/sites-available/homeservice-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d web.13-200-180-192.sslip.io
#
# Replace the server_name with the real domain when one exists; nothing else
# in this file changes.

server {
    listen 80;
    listen [::]:80;
    server_name web.13-200-180-192.sslip.io;

    root /srv/homeservice-web;
    index index.html;

    access_log /var/log/nginx/homeservice-web.access.log;
    error_log  /var/log/nginx/homeservice-web.error.log;

    # Flutter web is a single page app: the browser asks for /services or
    # /booking/42 and the server must still answer with index.html, because the
    # routing happens inside the app. Without this, the first load works and
    # every refresh or shared deep link 404s -- a bug that only appears once
    # someone sends a link to someone else.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web emits FIXED filenames -- main.dart.js, flutter_bootstrap.js,
    # assets/... -- with no content hash in them, so "immutable" here was a
    # trap: a returning visitor kept running whatever main.dart.js their
    # browser cached, for thirty days, however many times the site was
    # redeployed. Only a visitor with an empty cache, in a private window,
    # ever saw a new build.
    #
    # "expires -1" sends Cache-Control: no-cache, which still lets the browser
    # store the file -- it just has to ask first. Unchanged files come back as
    # a 304 with no body, so the cost is one conditional request, and a deploy
    # is visible on the next load instead of next month.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|otf|ico|mp4|wasm)$ {
        expires -1;
        try_files $uri =404;
    }

    # These three must NEVER be cached. They are how a browser discovers that a
    # new version exists; cache them and a returning visitor keeps running the
    # old app after every deploy, with no way to force an update short of
    # clearing their browser data.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # The app talks to the API on the other hostname over https, so nothing is
    # proxied here. That is why the backend needs this origin in
    # CORS_ALLOWED_ORIGINS -- see deploy/README.md.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # main.dart.js is several megabytes before compression.
    client_max_body_size 10M;
}
